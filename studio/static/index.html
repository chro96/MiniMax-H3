<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniMax Local Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#" class="brand"><span class="brand-mark">m</span><span>MiniMax<span class="brand-sub">LOCAL STUDIO</span></span></a>
    <p class="nav-label">WORKSPACE</p>
    <a class="nav-link active" href="#" id="library-link"><span>▦</span> 動画ライブラリ</a>
    <button class="nav-link" id="new-link"><span>＋</span> 新規制作</button>
    <div class="sidebar-bottom"><span class="local-dot"></span> ローカルに保存<p>Storyboard → Video → Library</p><button id="settings-link" class="text-button">生成環境の設定</button></div>
  </aside>
  <main>
    <header class="topbar"><span>制作ワークスペース</span><span class="topbar-right">MINIMAX H3 <span class="divider">/</span> 30 SEC</span></header>
    <div id="app" aria-live="polite"></div>
  </main>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="asset-upload" hidden>
  <input type="file" id="json-upload" accept="application/json,.json" hidden>
  <input type="file" id="comfy-upload" accept="application/json,.json" hidden>
</body>
</html>
